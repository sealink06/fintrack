<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="color-scheme" content="dark">
<title>Family FinTrack</title>
<style>
html{background:#05070d;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
/* Layout: sticky header (brand, family switcher, actions) over a pill nav, then one view at a time. Dark FolioDeck look carried over from the original app. */
:root{
  --ink-950:#05070d; --ink-900:#080c15; --ink-850:#0b111d; --ink-800:#0f1726; --ink-700:#162032; --ink-600:#1e2b41;
  --mist-400:#7c8aa5; --mist-300:#9aa7bd; --mist-200:#c4cddd; --mist-100:#e8edf6;
  --gain:#16c784; --gain-soft:#0d3b2e; --loss:#f6465d; --loss-soft:#3d1620;
  --accent:#7c5cff; --accent-2:#21d4fd; --amber:#f0b90b; --accent-soft:#c3b3ff;
  --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.14);
  --panel-a:rgba(20,28,44,.82); --panel-b:rgba(10,15,25,.9);
  --font-sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--ink-950);color:var(--mist-100);font-family:var(--font-sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:0 56px}
button,input,select,textarea{font:inherit;color:inherit}
.tnum,.mv,td,th{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(900px 520px at 12% -8%,rgba(124,92,255,.22),transparent 62%),
  radial-gradient(760px 460px at 92% 4%,rgba(33,212,253,.14),transparent 60%),
  radial-gradient(1100px 700px at 50% 120%,rgba(22,199,132,.10),transparent 65%),
  linear-gradient(180deg,#05070d 0%,#070b14 45%,#05070d 100%)}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;background-image:linear-gradient(to right,rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.028) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(circle at 50% 0%,#000,transparent 78%);mask-image:radial-gradient(circle at 50% 0%,#000,transparent 78%)}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto}
.panel{background:linear-gradient(160deg,var(--panel-a),var(--panel-b));border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -24px rgba(0,0,0,.9);padding:18px;min-width:0}
.label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist-400);font-weight:600}
.gain{color:var(--gain)} .loss{color:var(--loss)} .muted{color:var(--mist-400)} .soft{color:var(--mist-300)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--mist-200);white-space:nowrap}
.chip.gain{background:rgba(22,199,132,.12);border-color:rgba(22,199,132,.3);color:var(--gain)}
.chip.loss{background:rgba(246,70,93,.12);border-color:rgba(246,70,93,.3);color:var(--loss)}
.chip.warn{background:rgba(240,185,11,.12);border-color:rgba(240,185,11,.3);color:var(--amber)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;font-weight:600;font-size:13.5px;padding:9px 14px;transition:all .18s ease;border:1px solid transparent;cursor:pointer;white-space:nowrap;background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.pill:focus-visible,.scope:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row-click:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.btn-primary{background:linear-gradient(135deg,#7c5cff,#5b8cff);color:#fff;box-shadow:0 10px 26px -12px rgba(124,92,255,.9)}
.btn-primary:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,.04);border-color:var(--line-strong);color:var(--mist-200)}
.btn-ghost:hover:not(:disabled){background:rgba(255,255,255,.08)}
.btn-danger{background:rgba(246,70,93,.12);border-color:rgba(246,70,93,.35);color:#ff8497}
.btn-danger:hover:not(:disabled){background:rgba(246,70,93,.2)}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:9px}
.icon-btn{width:34px;height:34px;padding:0;border-radius:10px}
/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:12px 16px 10px;background:linear-gradient(180deg,rgba(5,7,13,.96),rgba(5,7,13,.82));backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#7c5cff,#21d4fd);box-shadow:0 8px 22px -8px rgba(124,92,255,.9)}
.brand b{font-size:15px;letter-spacing:-.01em;color:#fff;display:block;line-height:1.15}
.brand span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mist-400)}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.scopes,.nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.scopes::-webkit-scrollbar,.nav::-webkit-scrollbar{display:none}
.scope{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--mist-300);font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap}
.scope[aria-pressed=true]{background:rgba(124,92,255,.18);border-color:rgba(124,92,255,.5);color:#fff}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.pill{padding:7px 13px;border-radius:11px;border:1px solid transparent;background:none;color:var(--mist-400);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.pill:hover{color:var(--mist-100)}
.pill[aria-current=page]{color:#fff;background:rgba(255,255,255,.06);border-color:var(--line-strong)}
main{padding-top:18px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:15px;color:#fff} h3{font-size:13.5px;color:#fff}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g-hero{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
@media(max-width:820px){.g-hero{grid-template-columns:minmax(0,1fr)}}
.big{font-size:clamp(30px,6vw,46px);font-weight:750;letter-spacing:-.025em;color:#fff;line-height:1.05}
.kpi .v{font-size:22px;font-weight:700;color:#fff;margin-top:6px;letter-spacing:-.01em}
.kpi .s{font-size:12px;margin-top:3px}
.kpi-btn{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;appearance:none}
.kpi-btn:hover,.kpi-btn:focus-visible{border-color:var(--accent)}
.kpi-btn .label::after{content:' ›';color:var(--accent-2)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:12px 16px;border-radius:14px;border:1px solid rgba(240,185,11,.3);background:rgba(240,185,11,.07);color:var(--mist-200)}
.banner.info{border-color:rgba(33,212,253,.3);background:rgba(33,212,253,.06)}
/* tables */
.tbl-wrap{overflow-x:auto;border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:720px}
th{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mist-400);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--ink-850)}
th.l,td.l{text-align:left}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th button:focus-visible{outline:2px solid var(--accent-2)}
td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.045);text-align:right;white-space:nowrap}
tr.row-click{cursor:pointer}
tr.row-click:hover td{background:rgba(124,92,255,.07)}
td .nm{display:block;font-weight:600;color:#fff;max-width:300px;overflow:hidden;text-overflow:ellipsis}
td .sy{display:block;font-size:11.5px;color:var(--mist-400);max-width:300px;overflow:hidden;text-overflow:ellipsis}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{background:rgba(255,255,255,.04);border:1px solid var(--line-strong);border-radius:11px;padding:8px 11px;color:var(--mist-100);width:100%;min-width:0}
select option{background:var(--ink-800)}
input::placeholder{color:var(--mist-400)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mist-400);font-weight:600}
.fld small{color:var(--mist-400);font-size:11.5px}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:11px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 14px;color:var(--mist-300);font-weight:600;cursor:pointer}
.seg button[aria-pressed=true]{background:rgba(124,92,255,.25);color:#fff}
.seg button+button{border-left:1px solid var(--line-strong)}
/* bars */
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px}
.legend{display:flex;flex-direction:column;gap:9px}
.lg{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;font-size:13px}
.lg .pc{color:var(--mist-400);width:52px;text-align:right}
.donut-wrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.donut-wrap>svg{flex:none;width:190px;height:190px}
.donut-wrap .legend{flex:1;min-width:230px}
.rows{display:flex;flex-direction:column;gap:11px}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.hrow .bar{grid-column:1/-1}
.card-asset{display:flex;flex-direction:column;gap:8px}
.card-asset .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.empty{text-align:center;padding:46px 18px;display:flex;flex-direction:column;gap:14px;align-items:center}
.empty p{max-width:520px;margin:0;color:var(--mist-300)}
/* modal */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(3,5,10,.72);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto}
.modal{width:100%;max-width:600px;margin-block:auto;background:linear-gradient(160deg,#141c2c,#0a0f19);border:1px solid var(--line-strong);border-radius:20px;padding:20px;box-shadow:0 40px 80px -30px #000;display:flex;flex-direction:column;gap:16px}
.modal.wide{max-width:860px}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast-stack{position:fixed;z-index:80;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;padding-inline:16px}
.toast{background:#141c2c;border:1px solid var(--line-strong);border-radius:12px;padding:10px 14px;box-shadow:0 20px 40px -20px #000;max-width:520px;pointer-events:auto}
.toast.err{border-color:rgba(246,70,93,.5)}
.drop{border:1.5px dashed var(--line-strong);border-radius:16px;padding:30px 16px;text-align:center;color:var(--mist-300);cursor:pointer;transition:all .18s}
.drop:hover,.drop.over{border-color:var(--accent);background:rgba(124,92,255,.08)}
.sheetbox{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.sheetbox.off{opacity:.6}
.mini{font-size:12px;border-collapse:collapse;min-width:0;width:100%}
.mini td,.mini th{padding:4px 8px;font-size:12px;position:static;background:none}
.mini td{border-bottom:1px solid rgba(255,255,255,.04)}
body.mask .mv{filter:blur(7px);user-select:none}
.status{font-size:11.5px;color:var(--mist-400);display:inline-flex;align-items:center;gap:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.warnlist{margin:0;padding-left:18px;color:var(--mist-300);font-size:12.5px}
@media(max-width:560px){.donut-wrap>svg{margin-inline:auto}.panel{padding:14px}}
@media(max-width:640px){table.hl{min-width:0}.hl th:nth-child(2),.hl td:nth-child(2),.hl th:nth-child(3),.hl td:nth-child(3),.hl th:nth-child(4),.hl td:nth-child(4),.hl th:nth-child(6),.hl td:nth-child(6),.hl th:nth-child(8),.hl td:nth-child(8){display:none}.hl td .nm,.hl td .sy{max-width:44vw}.hl td,.hl th{padding-inline:7px}}
body.locked .wrap{visibility:hidden}
.lock{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:radial-gradient(900px 520px at 12% -8%,rgba(124,92,255,.22),transparent 62%),radial-gradient(760px 460px at 92% 4%,rgba(33,212,253,.14),transparent 60%),#05070d;overflow:auto}
.lock .box{width:100%;max-width:410px;display:flex;flex-direction:column;gap:14px}
.lock form{display:flex;flex-direction:column;gap:12px}
.lock .err{color:#ff8497;font-size:13px;min-height:18px}
@keyframes ftspin{to{transform:rotate(360deg)}}#btn-refresh.busy svg{animation:ftspin .9s linear infinite}
.linkbtn{background:none;border:0;padding:0;color:var(--mist-300);text-decoration:underline;cursor:pointer;font-size:12.5px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="backdrop"></div><div class="grid-bg"></div>
<div class="wrap">
  <header class="top"><div class="top-in">
    <div class="top-row">
      <div class="brand"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span><div><b>Family FinTrack</b><span id="brand-sub">Family wealth cockpit</span></div></div>
      <div class="actions">
        <span class="status" id="status"></span>
        <button class="btn btn-ghost icon-btn" id="btn-mask" title="Hide amounts" aria-label="Hide amounts" aria-pressed="false"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="btn btn-ghost icon-btn" id="btn-refresh" title="Refresh prices" aria-label="Refresh prices" data-act="refresh" hidden><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
        <button class="btn btn-ghost icon-btn" id="btn-lock" title="Lock" aria-label="Lock and sign out" hidden><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
        <button class="btn btn-ghost" data-act="go" data-v="import">Import</button>
        <button class="btn btn-primary" data-act="add-holding">+ Add</button>
      </div>
    </div>
    <div class="scopes" id="scopes" role="group" aria-label="Family member"></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
  </div></header>
  <main id="main" aria-live="polite"></main>
</div>
<div id="modal-root"></div>
<div class="toast-stack" id="toasts" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
/* ============================== helpers ============================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const INR0=new Intl.NumberFormat('en-IN',{maximumFractionDigits:0});
const INR2=new Intl.NumberFormat('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const USD2=new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fin=n=>typeof n==='number'&&isFinite(n);
const fmt=n=>!fin(n)?'—':(n<0?'−':'')+'₹'+INR0.format(Math.abs(Math.round(n)));
const compact=n=>{if(!fin(n))return '—';const a=Math.abs(n),s=n<0?'−':'';if(a>=1e7)return s+'₹'+(a/1e7).toFixed(2)+' Cr';if(a>=1e5)return s+'₹'+(a/1e5).toFixed(2)+' L';return fmt(n)};
const money=(v,ccy)=>!fin(v)?'—':(v<0?'−':'')+(ccy==='USD'?'$'+USD2.format(Math.abs(v)):'₹'+INR2.format(Math.abs(v)));
const qtyf=q=>!fin(q)?'—':(Math.abs(q-Math.round(q))<1e-9?INR0.format(q):q.toLocaleString('en-IN',{maximumFractionDigits:4}));
const pctf=x=>!fin(x)?'—':(x>=0?'+':'−')+Math.abs(x).toFixed(2)+'%';
const cls=n=>!fin(n)||n===0?'':(n>0?'gain':'loss');
const M=(n,c)=>`<span class="mv">${c?compact(n):fmt(n)}</span>`;
const MM=(v,ccy)=>`<span class="mv">${money(v,ccy)}</span>`;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dfmt=d=>{if(!d)return '—';const x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function saveLS(k,v){try{localStorage.setItem(k,v)}catch(e){}} function loadLS(k){try{return localStorage.getItem(k)}catch(e){return null}}

/* ============================== constants ============================== */
const CLASSES=['Equity (India)','Equity (US)','Debt','Hybrid','Gold','Silver','Real Estate','Retirement','Cash & Deposits','Other'];
const CLASS_COLOR={'Equity (India)':'#7c5cff','Equity (US)':'#21d4fd','Debt':'#16c784','Hybrid':'#5b8cff','Gold':'#f0b90b','Silver':'#c4cddd','Real Estate':'#ff8a5b','Retirement':'#f472b6','Cash & Deposits':'#2dd4bf','Other':'#c084fc','Indian stocks':'#7c5cff','ETFs':'#21d4fd','Mutual funds':'#16c784','US stocks':'#f0b90b','Bonds':'#ff8a5b'};
const TYPE_GROUP={stock:'Indian stocks',etf:'ETFs',mf:'Mutual funds',us:'US stocks',bond:'Bonds'};
const ASSET_CATS=[
  {k:'Gold',cls:'Gold',hint:'Jewellery, coins, bars'},{k:'Silver',cls:'Silver',hint:'Coins, bars, utensils'},
  {k:'Real Estate',cls:'Real Estate',hint:'Flat, plot, land, commercial'},{k:'Retirement',cls:'Retirement',hint:'PPF, EPF, NPS'},
  {k:'Cash & Deposits',cls:'Cash & Deposits',hint:'Savings, FD, RD'},{k:'Other',cls:'Other',hint:'Vehicle, business stake, lent money'},
  {k:'Liability',cls:null,hint:'Home loan, car loan, credit card'}];
const TYPE_LABEL={stock:'Stock',etf:'ETF',mf:'Mutual fund',us:'US stock',bond:'Bond'};
const PALETTE=['#7c5cff','#21d4fd','#16c784','#f0b90b','#ff8a5b','#f472b6','#38bdf8','#c084fc'];

/* ============================== state & storage ============================== */
const S={members:[],holdings:[],assets:[],snaps:[],settings:{fx:95,gold:null,silver:null},ready:{},view:'dashboard',scope:'all',
  hf:{q:'',cls:'',type:'',missing:false,sold:false,sort:'value',dir:-1},tf:{q:'',type:'',limit:150},mode:'local',writeOk:true,snapDone:false};

/* ============================== login lock (this device only) ============================== */
/* Your data is encrypted in the browser with a random data key. That key is stored twice, locked once by username + password and once by a recovery code.
   Either one opens it, so a forgotten password can be reset with the recovery code. Nothing is sent anywhere. */
const Auth={dek:null,rec:null,iters:200000,active:false,t:0,fails:0,
  ok(){try{if(!(window.crypto&&crypto.subtle&&window.TextEncoder))return false;localStorage.setItem('ft_probe','1');localStorage.removeItem('ft_probe');return true}catch(e){return false}},
  b64(buf){let s='';const a=new Uint8Array(buf);for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)},
  unb64(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a},
  rnd(n){return crypto.getRandomValues(new Uint8Array(n))},
  enc(s){return new TextEncoder().encode(s)},
  pwSecret(u,p){return String(u).trim().toLowerCase()+'\u0000'+p},
  rcSecret(c){return 'rc\u0000'+String(c).toUpperCase().replace(/[^A-Z0-9]/g,'')},
  genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=this.rnd(20);let s='';for(let i=0;i<20;i++){s+=A[r[i]%32];if(i%5===4&&i<19)s+='-'}return s},
  async kek(secret,salt,iters){const base=await crypto.subtle.importKey('raw',this.enc(secret),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iters,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])},
  newDek(){return crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt'])},
  async wrap(kek,dek){const raw=await crypto.subtle.exportKey('raw',dek),iv=this.rnd(12);return {iv:this.b64(iv),ct:this.b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},kek,raw))}},
  async unwrap(kek,w){const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:this.unb64(w.iv)},kek,this.unb64(w.ct));return crypto.subtle.importKey('raw',raw,'AES-GCM',true,['encrypt','decrypt'])},
  async wrapPw(u,p){const salt=this.rnd(16),k=await this.kek(this.pwSecret(u,p),salt,this.iters);return {salt:this.b64(salt),...await this.wrap(k,this.dek)}},
  async wrapRc(c){const salt=this.rnd(16),k=await this.kek(this.rcSecret(c),salt,this.iters);return {salt:this.b64(salt),...await this.wrap(k,this.dek)}},
  async seal(obj){const iv=this.rnd(12),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},this.dek,this.enc(JSON.stringify(obj)));return JSON.stringify({...this.rec,iv:this.b64(iv),ct:this.b64(ct)})},
  async open(rec,key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:this.unb64(rec.iv)},key,this.unb64(rec.ct));return JSON.parse(new TextDecoder().decode(pt))},
  persist(){clearTimeout(this.t);this.t=setTimeout(async()=>{try{saveLS('fintrack_enc_v1',await this.seal(snapState()))}catch(e){}},60)},
  async persistNow(){clearTimeout(this.t);saveLS('fintrack_enc_v1',await this.seal(snapState()))},
  async changeLogin(u,p){this.rec.pw=await this.wrapPw(u,p);await this.persistNow()},
  async newRecovery(){const c=this.genCode();this.rec.rc=await this.wrapRc(c);await this.persistNow();return c},
  codeFile(code){return 'Family FinTrack recovery code\n\n'+code+'\n\nKeep this somewhere safe and private. With this code you can set a new password if you forget yours. Anyone who has it and uses the same browser can open your data, so do not share it.\n'},
  async start(){
    if(!this.ok())return null;
    let rec=null;try{rec=JSON.parse(loadLS('fintrack_enc_v1')||'null')}catch(e){}
    if(rec&&!((rec.pw||rec.salt)&&rec.iv&&rec.ct))rec=null;
    if(!rec&&loadLS('ft_skip')==='1')return null;
    let old=null;try{old=JSON.parse(loadLS('fintrack_v1')||'null')}catch(e){}
    return new Promise(resolve=>this.screen(rec,old,resolve));
  },
  screen(rec,old,resolve){

    const codeScreen=(code,next)=>{

        <div class="panel" style="padding:14px;text-align:center"><div class="label" style="margin-bottom:6px">Recovery code</div><div id="rc-code" style="font-family:var(--font-mono);font-size:17px;letter-spacing:.06em;word-break:break-all;user-select:all">${code}</div></div>

      $('#rc-ok').addEventListener('change',e=>{$('#rc-go').disabled=!e.target.checked});

      $('#rc-dl').addEventListener('click',()=>blobSave('family-fintrack-recovery-code.txt',this.codeFile(code),'text/plain'));

    const renderSetup=()=>{
      root.innerHTML=`<div class="panel box">${head}<div><h2 style="font-size:18px">Create your login</h2><div class="muted" style="font-size:12.5px;margin-top:4px">Choose a username and password. Your data is locked with them on this device, and you will need them each time you open the dashboard.</div></div>
        ${hasOld?'<div class="banner info" style="padding:10px 12px;font-size:12.5px">Data already saved on this device will be locked with this login.</div>':''}
        <form id="lock-form" autocomplete="on"><label class="fld"><span>Username</span><input type="text" id="lk-user" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
        <label class="fld"><span>Password</span><input type="password" id="lk-pw" autocomplete="new-password" required></label>
        <label class="fld"><span>Confirm password</span><input type="password" id="lk-pw2" autocomplete="new-password" required><small>At least 8 characters.</small></label>
        <div class="err" id="lk-err" role="alert"></div>
        <button class="btn btn-primary" type="submit" id="lk-go">Create login</button></form>
        <div class="muted" style="font-size:12px">You will get a recovery code to keep, so a forgotten password can be reset.</div>
        <div style="text-align:center"><button class="linkbtn" type="button" id="lk-skip">Skip for now</button><div class="muted" style="font-size:12px;margin-top:4px">Try the dashboard as it is. You can add a login later from Settings.</div></div></div>`;
      const u=$('#lk-user');if(u)u.focus();
      $('#lk-skip').addEventListener('click',()=>{saveLS('ft_skip','1');root.remove();document.body.classList.remove('locked');resolve(null)});
      $('#lock-form').addEventListener('submit',run(async()=>{
        const user=$('#lk-user').value.trim(),pw=$('#lk-pw').value;
        if(!user){err('Enter a username.');return}
        if(pw.length<8){err('Use at least 8 characters for the password.');return}
        if(pw!==$('#lk-pw2').value){err('The two passwords do not match.');return}
        this.dek=await this.newDek();this.rec={v:2,iters:this.iters};
        this.rec.pw=await this.wrapPw(user,pw);const code=this.genCode();this.rec.rc=await this.wrapRc(code);
        const data=hasOld?old:{members:[],holdings:[],assets:[],snaps:[],settings:{}};
        saveLS('fintrack_enc_v1',await this.seal(data));
        try{localStorage.removeItem('fintrack_v1')}catch(x){}
        codeScreen(code,()=>finish(this.dek,hasOld?old:null));
      },lbl(true)));
    };
    const renderLogin=()=>{
      root.innerHTML=`<div class="panel box">${head}<div><h2 style="font-size:18px">Welcome back</h2><div class="muted" style="font-size:12.5px;margin-top:4px">Enter your username and password to open your dashboard.</div></div>
        <form id="lock-form" autocomplete="on"><label class="fld"><span>Username</span><input type="text" id="lk-user" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
        <label class="fld"><span>Password</span><input type="password" id="lk-pw" autocomplete="current-password" required></label>
        <div class="err" id="lk-err" role="alert"></div>
        <button class="btn btn-primary" type="submit" id="lk-go">Open dashboard</button></form>
        <div id="lk-forgot"><button class="linkbtn" type="button" id="lk-forgot-btn">Forgot your password?</button></div></div>`;
      const u=$('#lk-user');if(u)u.focus();
      $('#lk-forgot-btn').addEventListener('click',renderForgot);
      $('#lock-form').addEventListener('submit',run(async()=>{
        const user=$('#lk-user').value.trim(),pw=$('#lk-pw').value;
        if(!user){err('Enter a username.');return}
        if(this.fails>0)await sleep(Math.min(this.fails*700,4000));
        if(rec.pw){
          this.iters=rec.iters||this.iters;
          let dek,data;try{const k=await this.kek(this.pwSecret(user,pw),this.unb64(rec.pw.salt),this.iters);dek=await this.unwrap(k,rec.pw);data=await this.open(rec,dek)}catch(x){this.fails++;err('Incorrect username or password.');return}
          this.rec={v:2,iters:this.iters,pw:rec.pw,rc:rec.rc};finish(dek,data);
        }else{ /* login made by the first version: open it, then add a recovery code */
          let data;try{const k=await this.kek(this.pwSecret(user,pw),this.unb64(rec.salt),rec.iters||this.iters);data=await this.open(rec,k)}catch(x){this.fails++;err('Incorrect username or password.');return}
          this.iters=rec.iters||this.iters;this.dek=await this.newDek();this.rec={v:2,iters:this.iters};
          this.rec.pw=await this.wrapPw(user,pw);const code=this.genCode();this.rec.rc=await this.wrapRc(code);
          saveLS('fintrack_enc_v1',await this.seal(data));codeScreen(code,()=>finish(this.dek,data));
        }
      },lbl(false)));
    };
    const renderForgot=()=>{
      if(!rec.rc){root.innerHTML=`<div class="panel box">${head}<div><h2 style="font-size:18px">Reset your login</h2><div class="muted" style="font-size:12.5px;margin-top:4px">This login was made before recovery codes existed, so it cannot be reset. You can erase the data on this device and create a new login.</div></div><div id="lk-forgot"></div><button class="linkbtn" type="button" id="lk-back">Back to sign in</button></div>`;
        eraseBlock();$('#lk-cancel').addEventListener('click',renderLogin);$('#lk-back').addEventListener('click',renderLogin);return}
      root.innerHTML=`<div class="panel box">${head}<div><h2 style="font-size:18px">Reset your password</h2><div class="muted" style="font-size:12.5px;margin-top:4px">Enter the recovery code you saved when you created your login, then choose a new username and password. Your data stays as it is.</div></div>
        <form id="lock-form" autocomplete="off"><label class="fld"><span>Recovery code</span><input type="text" id="fg-code" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-XXXXX-XXXXX-XXXXX" required></label>
        <label class="fld"><span>New username</span><input type="text" id="lk-user" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
        <label class="fld"><span>New password</span><input type="password" id="lk-pw" autocomplete="new-password" required></label>
        <label class="fld"><span>Confirm new password</span><input type="password" id="lk-pw2" autocomplete="new-password" required><small>At least 8 characters.</small></label>
        <div class="err" id="lk-err" role="alert"></div>
        <button class="btn btn-primary" type="submit" id="lk-go">Reset and open</button></form>
        <div id="lk-forgot" style="display:flex;flex-direction:column;gap:8px;align-items:flex-start"><button class="linkbtn" type="button" id="lk-back">Back to sign in</button><button class="linkbtn" type="button" id="lk-nocode">I do not have my recovery code</button></div></div>`;
      $('#fg-code').focus();$('#lk-back').addEventListener('click',renderLogin);$('#lk-nocode').addEventListener('click',eraseBlock);
      $('#lock-form').addEventListener('submit',run(async()=>{
        const code=$('#fg-code').value,user=$('#lk-user').value.trim(),pw=$('#lk-pw').value;
        if(!user){err('Enter a username.');return}
        if(pw.length<8){err('Use at least 8 characters for the password.');return}
        if(pw!==$('#lk-pw2').value){err('The two passwords do not match.');return}
        if(this.fails>0)await sleep(Math.min(this.fails*700,4000));
        this.iters=rec.iters||this.iters;
        let dek,data;try{const k=await this.kek(this.rcSecret(code),this.unb64(rec.rc.salt),this.iters);dek=await this.unwrap(k,rec.rc);data=await this.open(rec,dek)}catch(x){this.fails++;err('That recovery code does not match.');return}
        this.dek=dek;this.rec={v:2,iters:this.iters,rc:rec.rc};this.rec.pw=await this.wrapPw(user,pw);
        saveLS('fintrack_enc_v1',await this.seal(data));finish(dek,data);setTimeout(()=>toast('Password reset. Your recovery code still works.'),300);
      },'Reset and open'));
    };
    if(rec)renderLogin();else renderSetup();
  }
};
function blobSave(name,text,type){try{const u=URL.createObjectURL(new Blob([text],{type:type||'text/plain'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true}catch(e){return false}}
/* ============================== live prices (downloadable copy only) ============================== */
/* Mutual funds: mfapi.in (AMFI NAV). Gold and silver: gold-api.com spot in USD per troy ounce, converted with the USD to INR rate.
   Stocks, ETFs, US shares, bonds: Yahoo Finance chart data, reached through a relay because Yahoo does not allow direct calls from web pages. */
const Live={busy:false,route:null,timer:0,
  async fj(url,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||9000);try{const r=await fetch(url,{signal:c.signal,cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}},
  routes(){const u=String(S.settings.proxyUrl||'').trim(),r=[{n:'direct',f:x=>x}];
    if(/\{url\}/.test(u))r.unshift({n:'custom',f:x=>u.replace('{url}',encodeURIComponent(x))});
    r.push({n:'corsproxy',f:x=>'https://corsproxy.io/?url='+encodeURIComponent(x)},{n:'allorigins',f:x=>'https://api.allorigins.win/raw?url='+encodeURIComponent(x)});return r},
  async yahoo(sym){
    const url='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(sym)+'?range=5d&interval=1d';
    const rs=this.routes(),first=rs.find(r=>r.n===this.route),order=first?[first,...rs.filter(r=>r!==first)]:rs;let last;
    for(const r of order){
      try{const j=await this.fj(r.f(url),10000);const res=j&&j.chart&&j.chart.result&&j.chart.result[0];
        if(!res||!res.meta){if(j&&j.chart&&j.chart.error)throw new Error('notfound');throw new Error('bad reply')}
        this.route=r.n;return res}
      catch(e){last=e;if(e.message==='notfound'||/HTTP 404/.test(e.message))throw new Error('notfound')}
    }
    throw last||new Error('unreachable')},
  quote(res){const m=res.meta,q=res.indicators&&res.indicators.quote&&res.indicators.quote[0],cl=((q&&q.close)||[]).filter(x=>x!=null&&isFinite(x));
    const price=m.regularMarketPrice!=null?m.regularMarketPrice:cl[cl.length-1];if(!(price>0))throw new Error('no price');
    let prev=cl.length>=2?cl[cl.length-2]:m.previousClose;if(!(prev>0))prev=null;
    return {price,chg:prev?(price-prev)/prev*100:null}},
  ycands(h){if(h.ysym)return [h.ysym];const s=String(h.sym||'').trim();if(!s||/^(UNIDENTIFIED|MUTF)/i.test(s))return [];
    if(h.type==='us')return [s.replace(/\./g,'-')];if(/^\d+$/.test(s))return [s+'.BO'];return [s+'.NS',s+'.BO']},
  toks(n){return String(n||'').toLowerCase().replace(/[^a-z0-9 ]+/g,' ').split(/\s+/).filter(w=>w&&!/^(fund|plan|option|scheme|the|of|and)$/.test(w))},
  async mfCode(h){
    if(h.code)return String(h.code);
    const mine=this.toks(h.name),wantDirect=mine.includes('direct'),wantIdcw=mine.some(w=>/idcw|dividend|bonus/.test(w)),core=mine.filter(w=>!/^(direct|growth|regular|idcw|dividend|bonus)$/.test(w));
    if(!core.length)throw new Error('no name');
    for(const n of [4,3]){
      const q=String(h.name).replace(/[-()]/g,' ').split(/\s+/).filter(Boolean).slice(0,n).join(' ');
      let list;try{list=await this.fj('https://api.mfapi.in/mf/search?q='+encodeURIComponent(q))}catch(e){continue}
      let best=null,bs=0;
      for(const c of (list||[])){const ct=this.toks(c.schemeName);if(!ct.length)continue;
        const hit=core.filter(w=>ct.includes(w)).length/core.length;if(hit<0.8)continue;
        let sc=hit;const d=ct.includes('direct'),g=ct.includes('growth'),i=ct.some(w=>/idcw|dividend|bonus/.test(w));
        if(d===wantDirect)sc+=1;if(g&&!wantIdcw)sc+=1;if(i&&!wantIdcw)sc-=2;if(wantIdcw&&i)sc+=1;
        sc-=Math.max(0,ct.length-mine.length)*0.02;
        if(sc>bs){bs=sc;best=c}}
      if(best&&bs>=2)return String(best.schemeCode);
    }
    throw new Error('fund not matched');
  },
  async mf(h){const code=await this.mfCode(h);const j=await this.fj('https://api.mfapi.in/mf/'+code+'/latest',10000);
    const d=j&&j.data&&j.data[0],nav=d&&parseFloat(d.nav);if(!(nav>0))throw new Error('no NAV');
    const m=/^(\d{2})-(\d{2})-(\d{4})$/.exec(d.date||''),iso=m?m[3]+'-'+m[2]+'-'+m[1]:null;
    let chg=h.chg||0;if(fin(h.price)&&h.price>0&&iso&&h.navDate&&iso>h.navDate)chg=(nav-h.price)/h.price*100;
    return {price:nav,chg,code,navDate:iso}},
  async usdinr(){try{const j=await this.fj('https://open.er-api.com/v6/latest/USD');const v=j&&j.rates&&j.rates.INR;if(v>0)return v}catch(e){}
    return this.quote(await this.yahoo('USDINR=X')).price},
  async metal(code,y){try{const j=await this.fj('https://api.gold-api.com/price/'+code);if(j&&j.price>0)return j.price}catch(e){}
    return this.quote(await this.yahoo(y)).price},
  setBusy(b){this.busy=b;const el=$('#btn-refresh');if(el)el.classList.toggle('busy',b)},
  async refresh(manual,only){
    if(this.busy||S.mode!=='local')return;
    if(typeof navigator!=='undefined'&&navigator.onLine===false){if(manual)toast('You are offline',true);return}
    this.setBusy(true);const rep={ok:0,fails:[],fx:false,metals:false};const st={};
    try{
      let fx=null;try{fx=await this.usdinr();rep.fx=true}catch(e){}
      if(fx>0){st.fx=+(+fx).toFixed(4);st.fxAt=today()}else fx=S.settings.fx;
      if(!only&&S.settings.metalAuto!==false&&fx>0){
        try{const [g,sv]=await Promise.all([this.metal('XAU','GC=F'),this.metal('XAG','SI=F')]);const k=fx/31.1034768*(1+(+S.settings.premium||0)/100);
          st.gold=Math.round(g*k*100)/100;st.silver=Math.round(sv*k*100)/100;st.metalAt=new Date().toISOString();rep.metals=true}catch(e){}
      }
      const todo=S.holdings.filter(h=>(!only||only.includes(h.id))&&calcPos(h).qty>0);
      const out=new Map(),q=todo.slice();
      const worker=async()=>{while(q.length){const h=q.shift();
        try{
          if(h.type==='mf'){const r=await this.mf(h);out.set(h.id,{price:r.price,chg:r.chg,code:r.code,navDate:r.navDate})}
          else{const cs=this.ycands(h);if(!cs.length)throw new Error('no symbol');let done=false,err;
            for(const c of cs){try{const r=this.quote(await this.yahoo(c));out.set(h.id,{price:r.price,chg:r.chg==null?(h.chg||0):r.chg,ysym:c});done=true;break}catch(e){err=e;if(e.message!=='notfound')break}}
            if(!done)throw err||new Error('not found')}
          rep.ok++;
        }catch(e){rep.fails.push({n:h.name||h.sym,s:h.sym,w:e.message==='notfound'?'not found':e.message})}
      }};
      await Promise.all([worker(),worker(),worker(),worker()]);
      const now=Date.now(),day=today();
      S.holdings=S.holdings.map(h=>out.has(h.id)?{...h,...out.get(h.id),priceAt:day,pxTs:now}:h);
      if(!only)st.lastRefresh={at:new Date().toISOString(),ok:rep.ok,total:todo.length,fx:rep.fx,metals:rep.metals,route:this.route||null,fails:rep.fails.slice(0,40)};
      Store.put('settings',st);

const Store={db:null,chains:new Map(),
  async init(){
    try{ if(window.claude&&typeof window.claude.use==='function') this.db=await window.claude.use('db'); }catch(e){this.db=null}
    if(this.db){S.mode='db';this.subscribe()}else{S.mode='local';const a=await Auth.start();this.loadLocal(a&&a.data)}
    updateStatus();
  },
  subscribe(){
    for(const c of ['members','holdings','assets','snaps','settings']){
      try{
        this.db.collection(c).onSnapshot(snap=>{
          const rows=snap.docs.map(d=>({...d.data(),id:d.id}));
          if(c==='settings'){const m=rows.find(r=>r.id==='main');if(m)S.settings={...S.settings,...m}}
          else S[c]=rows;
          S.ready[c]=true;
          if(c==='members'&&!S.members.length)setTimeout(()=>this.ensureMember(),1800);
          scheduleRender();afterLoad();
        },err=>{S.ready[c]=true;S.dbError=err&&err.code;updateStatus();scheduleRender()});
      }catch(e){S.ready[c]=true}
    }
  },
  loadLocal(pre){
    let d=pre||null;if(!d&&!Auth.active){try{d=JSON.parse(loadLS('fintrack_v1')||'null')}catch(e){}}
    if(d){for(const k of ['members','holdings','assets','snaps'])S[k]=d[k]||[];S.settings={...S.settings,...(d.settings||{})}}
    for(const c of ['members','holdings','assets','snaps','settings'])S.ready[c]=true;
    if(!S.members.length)this.ensureMember();
    scheduleRender();afterLoad();
  },
  saveLocal(){if(Auth.active)Auth.persist();else saveLS('fintrack_v1',JSON.stringify(snapState()))},
  ensureMember(){ if(S.members.length)return; const m={id:'m_'+uid(),name:'Me',relation:'Self',color:PALETTE[0],order:0}; this.put('members',m) },
  _chain(key,fn){
    const prev=this.chains.get(key)||Promise.resolve();
    const run=prev.catch(()=>{}).then(async()=>{try{await fn()}catch(e){ if(e&&e.code==='unavailable'||e&&e.code==='resource_exhausted'){await sleep(700+Math.random()*500);await fn()} else throw e }});
    this.chains.set(key,run);return run;
  },
  put(coll,obj){
    if(coll==='settings'){S.settings={...S.settings,...obj}}
    else{const i=S[coll].findIndex(x=>x.id===obj.id);if(i>=0)S[coll][i]=obj;else S[coll].push(obj)}
    scheduleRender();
    if(!this.db){this.saveLocal();return Promise.resolve()}
    const id=coll==='settings'?'main':obj.id;const body={...(coll==='settings'?S.settings:obj)};delete body.id;
    return this._chain(coll+'/'+id,()=>this.db.collection(coll).doc(id).set(body)).catch(e=>{toast('Could not save: '+((e&&e.message)||(e&&e.code)||'unknown error'),true);S.writeOk=false;updateStatus()});
  },
  del(coll,id){
    S[coll]=S[coll].filter(x=>x.id!==id);scheduleRender();
    if(!this.db){this.saveLocal();return Promise.resolve()}
    return this._chain(coll+'/'+id,()=>this.db.collection(coll).doc(id).delete()).catch(e=>toast('Could not delete: '+((e&&e.message)||'error'),true));
  },
  async putMany(coll,items,onProg){
    let done=0;const q=items.slice();
    const worker=async()=>{while(q.length){const it=q.shift();await this.put(coll,it);done++;if(onProg)onProg(done,items.length);if(this.db&&done%20===0)await sleep(40)}};
    await Promise.all([worker(),worker(),worker()]);
  }
};
function snapState(){return {members:S.members,holdings:S.holdings,assets:S.assets,snaps:S.snaps,settings:S.settings}}

let rafId=0,dirty=false;
function scheduleRender(){ if(rafId)return; rafId=requestAnimationFrame(()=>{rafId=0;const a=document.activeElement;if(a&&$('#main').contains(a)&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)){dirty=true;return}render()}) }

let toastT=0;
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),err?6000:3200)}

/* ============================== engine ============================== */
/* Average-cost method. Open = existing position at a known (or unknown) average; buy adds a lot; sell reduces quantity at the running average. */
function calcPos(h,extra){
  const list=(h.txns||[]).concat(extra?[extra]:[]);
  const tx=list.map((t,i)=>({...t,i})).sort((a,b)=>{const x=a.d||'',y=b.d||'';return x<y?-1:x>y?1:a.i-b.i});
  let q=0,qk=0,ck=0,real=0;const warn=[];
  for(const t of tx){
    const n=+t.q||0,p=t.p==null||t.p===''?null:+t.p,fee=+t.fee||0;
    if(t.t==='sell'){
      let m=n;if(m>q+1e-9){warn.push('Sold more than held'+(t.d?' on '+dfmt(t.d):''));m=q}
      if(m<=0)continue;
      const r=m/q,avgK=qk>0?ck/qk:null;
      if(avgK!=null&&p!=null)real+=(p-avgK)*Math.min(m,qk)-fee;
      qk-=qk*r;ck-=ck*r;q-=m;if(q<1e-9){q=0;qk=0;ck=0}
    }else{
      q+=n;if(p!=null){qk+=n;ck+=n*p+(t.t==='buy'?fee:0)}
    }
  }
  return {qty:q,avg:qk>0?ck/qk:null,cost:ck,qtyKnown:qk,known:q>0&&q-qk<1e-9,partial:q-qk>1e-9&&qk>0,realized:real,warn};
}
function enrich(h){
  const pos=calcPos(h),fx=h.ccy==='USD'?(S.settings.fx||0):1,price=fin(h.price)?h.price:0;
  const value=pos.qty*price*fx,costI=pos.cost*fx;
  const pnl=pos.qtyKnown>0?pos.qtyKnown*price*fx-costI:null;
  const pnlPct=pos.qtyKnown>0&&costI>0?pnl/costI*100:null;
  const chg=fin(h.chg)?h.chg:0,dayV=value*(chg/100)/(1+chg/100);
  return {h,pos,fx,price,value,costI,pnl,pnlPct,dayV,chg,realized:pos.realized*fx};
}
function assetValue(a){
  if(a.mode==='grams'&&(a.cat==='Gold'||a.cat==='Silver')){
    const r=a.cat==='Gold'?S.settings.gold:S.settings.silver;
    if(!fin(r))return {v:0,missingRate:true};
    return {v:(+a.grams||0)*r*(+a.fine||1)};
  }
  return {v:+a.value||0};
}
function inScope(m,scope){return scope==='all'||m===scope}
function compute(scope){
  const hs=S.holdings.filter(h=>inScope(h.member,scope)).map(enrich).filter(e=>e.pos.qty>0||S.hf.sold&&false);
  const as=S.assets.filter(a=>inScope(a.member,scope)).map(a=>({a,...assetValue(a)}));
  const byClass={},byMember={},pnlByClass={};let mkt=0,inv=0,pnl=0,real=0,day=0,other=0,liab=0,missCost=0,missRate=0,costCovered=0,mktInv=0,mktPnl=0;
  const pc=k=>pnlByClass[k]||(pnlByClass[k]={value:0,cov:0,inv:0,pnl:0,n:0});
  const addM=(m,v)=>{byMember[m]=(byMember[m]||0)+v};
  for(const e of hs){mkt+=e.value;day+=e.dayV;real+=e.realized;byClass[e.h.cls]=(byClass[e.h.cls]||0)+e.value;addM(e.h.member,e.value);
    const o=pc(e.h.cls);o.value+=e.value;o.n++;
    if(e.pos.qtyKnown>0){const cv=e.pos.qtyKnown*e.price*e.fx;inv+=e.costI;pnl+=e.pnl;costCovered+=cv;mktInv+=e.costI;mktPnl+=e.pnl;o.cov+=cv;o.inv+=e.costI;o.pnl+=e.pnl}
    if(!e.pos.known)missCost++}
  for(const x of as){
    if(x.missingRate)missRate++;
    if(x.a.cat==='Liability'){liab+=x.v;addM(x.a.member,-x.v)}
    else{other+=x.v;const c=(ASSET_CATS.find(c=>c.k===x.a.cat)||{}).cls||'Other';byClass[c]=(byClass[c]||0)+x.v;addM(x.a.member,x.v)
      const o=pc(c);o.value+=x.v;o.n++;const cost=+x.a.cost;
      if(cost>0&&!x.missingRate){const g=x.v-cost;inv+=cost;pnl+=g;costCovered+=x.v;o.cov+=x.v;o.inv+=cost;o.pnl+=g}}
  }
  const assets=mkt+other;
  return {hs,as,byClass,byMember,pnlByClass,mktInv,mktPnl,mkt,inv,pnl,real,day,other,liab,assets,net:assets-liab,missCost,missRate,costCovered,
    pnlPct:inv>0?pnl/inv*100:null,dayPct:mkt-day>0?day/(mkt-day)*100:null};
}
function memberOf(id){return S.members.find(m=>m.id===id)||{name:'Unknown',color:'#7c8aa5'}}
function scopeName(){return S.scope==='all'?'Whole family':memberOf(S.scope).name}

/* snapshot of net worth, one per day, builds the trend line */
function afterLoad(){
  if(S.snapDone||!Object.values(S.ready).length||!['members','holdings','assets','snaps','settings'].every(k=>S.ready[k]))return;
  S.snapDone=true;
  if(!S.writeOk||(!S.holdings.length&&!S.assets.length))return;
  const c=compute('all'),d=today();
  if(c.net<=0)return;
  const last=S.snaps.slice().sort((a,b)=>a.id<b.id?1:-1)[0];
  if(last&&last.id===d)return;
  Store.put('snaps',{id:d,net:Math.round(c.net),assets:Math.round(c.assets),liab:Math.round(c.liab),byClass:Object.fromEntries(Object.entries(c.byClass).map(([k,v])=>[k,Math.round(v)]))});
}

/* ============================== charts ============================== */
function donut(entries,total,centerLabel,centerValue){
  const R=70,C=2*Math.PI*R;let off=0;
  const arcs=entries.map(([k,v])=>{const len=total>0?v/total*C:0;const s=`<circle cx="95" cy="95" r="${R}" fill="none" stroke="${CLASS_COLOR[k]||'#7c8aa5'}" stroke-width="22" stroke-dasharray="${Math.max(len-1.5,0)} ${C-Math.max(len-1.5,0)}" stroke-dashoffset="${-off}" transform="rotate(-90 95 95)"><title>${esc(k)}: ${fmt(v)}</title></circle>`;off+=len;return s}).join('');
  return `<svg viewBox="0 0 190 190" role="img" aria-label="Allocation by asset class"><circle cx="95" cy="95" r="${R}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="22"/>${arcs}<text x="95" y="90" text-anchor="middle" fill="#7c8aa5" font-size="9.5" letter-spacing="1.4" font-weight="600">${esc(centerLabel.toUpperCase())}</text><text x="95" y="110" text-anchor="middle" fill="#fff" font-size="16" font-weight="700" class="mv">${esc(centerValue)}</text></svg>`;
}
function trendChart(points){
  const W=560,H=190,L=8,R=8,T=14,B=26;
  const vs=points.map(p=>p.net),mn=Math.min(...vs),mx=Math.max(...vs),span=(mx-mn)||Math.max(mx*.02,1);
  const lo=mn-span*.15,hi=mx+span*.15;
  const x=i=>L+(points.length===1?(W-L-R)/2:i*(W-L-R)/(points.length-1)),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const path=points.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.net).toFixed(1)).join(' ');
  const area=path+` L${x(points.length-1).toFixed(1)} ${H-B} L${x(0).toFixed(1)} ${H-B} Z`;
  const grid=[0,.5,1].map(f=>{const v=lo+(hi-lo)*f,yy=y(v);return `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="rgba(255,255,255,.06)"/>`}).join('');
  const lx=points.length>1?[0,points.length-1]:[0];
  const labels=lx.map(i=>`<text x="${x(i)}" y="${H-8}" fill="#7c8aa5" font-size="10.5" text-anchor="${i===0&&points.length>1?'start':points.length===1?'middle':'end'}">${esc(dfmt(points[i].id))}</text>`).join('');
  const last=points[points.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Net worth over time" style="display:block;max-width:100%"><defs><linearGradient id="tg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#7c5cff" stop-opacity=".35"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#tg)"/><path d="${path}" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${x(points.length-1)}" cy="${y(last.net)}" r="4.5" fill="#21d4fd" stroke="#05070d" stroke-width="2"/>${labels}</svg>`;
}

function kpi(l,v,s,act){return act?`<button type="button" class="panel kpi kpi-btn" data-act="${act}"><div class="label">${l}</div><div class="v">${v}</div><div class="s muted">${s}</div></button>`:`<div class="panel kpi"><div class="label">${l}</div><div class="v">${v}</div><div class="s muted">${s}</div></div>`}
function topList(top,max){return `<div class="rows">${top.map(e=>`<div class="hrow"><span style="min-width:0"><b>${esc(e.h.name||e.h.sym)}</b> ${e.h.type==='mf'?'':`<span class="muted">${esc(e.h.sym)}</span>`}</span><span class="mv">${compact(e.value)}</span><div class="bar"><i style="width:${e.value/max*100}%;background:${CLASS_COLOR[e.h.cls]||'#7c5cff'}"></i></div></div>`).join('')||'<span class="muted">No holdings yet</span>'}</div>`}
function moverRow(e){return `<div class="hrow"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(e.h.name||e.h.sym)}"><b>${esc(e.h.type==='mf'?(e.h.name||e.h.sym):e.h.sym)}</b></span><span class="${cls_(e.chg)} tnum">${pctf(e.chg)}</span></div>`}

/* ---------- breakdown modals ---------- */
function mktModal(){
  const c=compute(S.scope),g={};
  for(const e of c.hs){const k=TYPE_GROUP[e.h.type]||'Other';const o=g[k]||(g[k]={n:0,value:0,inv:0,pnl:0});o.n++;o.value+=e.value;if(e.pos.qtyKnown>0){o.inv+=e.costI;o.pnl+=e.pnl}}
  const ents=Object.entries(g).sort((a,b)=>b[1].value-a[1].value),tot=ents.reduce((s,[,o])=>s+o.value,0);

  const rows=ents.map(([k,o])=>`<tr><td class="l"><span class="dot" style="background:${CLASS_COLOR[k]||'#7c8aa5'};margin-right:7px"></span>${esc(k)}</td><td>${o.n}</td><td><b>${M(o.value)}</b></td><td>${(o.value/tot*100).toFixed(1)}%</td><td class="${cls_(o.pnl)}">${o.inv>0?M(o.pnl):'—'}</td><td class="${cls_(o.pnl)}">${o.inv>0?pctf(o.pnl/o.inv*100):'—'}</td></tr>`).join('');
  openModal(`${mhead('Market investments',esc(scopeName())+' · by type')}
    <div class="donut-wrap">${donut(ents.map(([k,o])=>[k,o.value]),tot,'Market value',compact(tot))}
    <div class="legend">${ents.map(([k,o])=>`<div class="lg"><span class="dot" style="background:${CLASS_COLOR[k]||'#7c8aa5'}"></span><span>${esc(k)}</span><span class="mv">${compact(o.value)}</span><span class="pc tnum">${(o.value/tot*100).toFixed(1)}%</span></div>`).join('')}</div></div>
    <div class="tbl-wrap" style="margin-top:14px"><table style="min-width:460px"><thead><tr><th class="l">Type</th><th>Holdings</th><th>Value</th><th>Share</th><th>P&L</th><th>Return</th></tr></thead><tbody>${rows}
    <tr><td class="l"><b>Total</b></td><td>${c.hs.length}</td><td><b>${M(tot)}</b></td><td>100%</td><td class="${cls_(c.mktPnl)}">${c.mktInv>0?M(c.mktPnl):'—'}</td><td class="${cls_(c.mktPnl)}">${c.mktInv>0?pctf(c.mktPnl/c.mktInv*100):'—'}</td></tr></tbody></table></div>
    <div class="muted" style="font-size:12px;margin-top:10px">P&L counts only units that have a buy price.</div>`);
}
function pnlModal(){
  const c=compute(S.scope);
  const ents=CLASSES.map(k=>[k,c.pnlByClass[k]]).filter(e=>e[1]&&e[1].value>0);
  if(!ents.length){openModal(`${mhead('Unrealised P&L',esc(scopeName()))}<div class="muted">Nothing to show yet.</div>`);return}

  const bars=ents.filter(([,o])=>o.inv>0).map(([k,o])=>`<div class="hrow"><span>${esc(k)}</span><span class="${cls_(o.pnl)} mv">${compact(o.pnl)}</span><div class="bar"><i style="width:${Math.abs(o.pnl)/maxAbs*100}%;background:${o.pnl>=0?'var(--gain)':'var(--loss)'}"></i></div></div>`).join('');
  openModal(`${mhead('Unrealised P&L',esc(scopeName())+' · by asset class')}
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px"><div class="panel kpi"><div class="label">Total P&L</div><div class="v ${cls_(c.pnl)}">${c.inv>0?M(c.pnl):'—'}</div><div class="s muted ${cls_(c.pnl)}">${c.inv>0?pctf(c.pnlPct):''}</div></div>
    <div class="panel kpi"><div class="label">Invested</div><div class="v">${M(c.inv)}</div><div class="s muted">with a known cost</div></div></div>
    ${bars?`<div class="rows" style="margin-bottom:12px">${bars}</div>`:''}
    <div class="tbl-wrap"><table style="min-width:460px"><thead><tr><th class="l">Asset class</th><th>Value</th><th>Invested</th><th>P&L</th><th>Return</th></tr></thead><tbody>${rows}
    <tr><td class="l"><b>Total</b></td><td>${M(c.mkt+c.other)}</td><td>${c.inv>0?M(c.inv):'—'}</td><td class="${cls_(c.pnl)}"><b>${c.inv>0?M(c.pnl):'—'}</b></td><td class="${cls_(c.pnl)}">${c.inv>0?pctf(c.pnlPct):'—'}</td></tr></tbody></table></div>
    <div class="muted" style="font-size:12px;margin-top:10px">Market holdings use the average buy price. Gold, silver, property and other assets use the cost you entered. Loans are not counted. Anything without a cost is left out of P&L.</div>`);
}
/* ---------- holdings ---------- */
function holdingRows(){
  const f=S.hf,q=f.q.trim().toLowerCase();
  let list=S.holdings.filter(h=>inScope(h.member,S.scope)).map(enrich);
  if(!f.sold)list=list.filter(e=>e.pos.qty>0);
  if(q)list=list.filter(e=>(e.h.sym+' '+(e.h.name||'')+' '+(e.h.sector||'')).toLowerCase().includes(q));
  if(f.cls)list=list.filter(e=>e.h.cls===f.cls);
  if(f.type)list=list.filter(e=>e.h.type===f.type);
  if(f.missing)list=list.filter(e=>!e.pos.known&&e.pos.qty>0);
  const key={name:e=>(e.h.name||e.h.sym).toLowerCase(),qty:e=>e.pos.qty,avg:e=>e.pos.avg??-1,price:e=>e.price,value:e=>e.value,day:e=>e.chg,pnl:e=>e.pnl??-1e15,pct:e=>e.pnlPct??-1e15}[f.sort]||(e=>e.value);
  list.sort((a,b)=>{const x=key(a),y=key(b);return (x<y?-1:x>y?1:0)*f.dir});
  return list;
}
function holdingsBody(){
  const list=holdingRows(),multi=S.scope==='all'&&S.members.length>1;
  if(!list.length)return `<tr><td colspan="9" class="l muted" style="padding:28px">No holdings match.</td></tr>`;
  return list.map(e=>{const h=e.h,m=memberOf(h.member);
    return `<tr class="row-click" tabindex="0" data-act="open-holding" data-id="${esc(h.id)}"><td class="l"><span class="nm">${multi?`<span class="dot" style="background:${esc(m.color)};margin-right:7px" title="${esc(m.name)}"></span>`:''}${esc(h.name||h.sym)}</span><span class="sy">${esc(h.sym)} · ${esc(TYPE_LABEL[h.type]||h.type)}${h.ccy==='USD'?' · USD':''}</span></td>
    <td>${qtyf(e.pos.qty)}</td><td>${e.pos.avg!=null?MM(e.pos.avg,h.ccy)+(e.pos.partial?' <span class="chip warn" title="Some units have no buy price">part</span>':''):'<span class="chip warn">add</span>'}</td>
    <td>${fin(h.price)?MM(h.price,h.ccy):'—'}</td><td><b>${M(e.value)}</b></td><td class="${cls_(e.chg)}">${fin(h.chg)?pctf(e.chg):'—'}</td>
    <td class="${cls_(e.pnl)}">${e.pnl!=null?M(e.pnl):'—'}</td><td class="${cls_(e.pnlPct)}">${e.pnlPct!=null?pctf(e.pnlPct):'—'}</td></tr>`}).join('');
}
function th(key,label,left){const f=S.hf;const ar=f.sort===key?(f.dir<0?'↓':'↑'):'';return `<th class="${left?'l':''}" aria-sort="${f.sort===key?(f.dir<0?'descending':'ascending'):'none'}"><button data-act="sort" data-k="${key}">${label}<span>${ar}</span></button></th>`}
function vHoldings(){
  const l=loadingOrEmpty();if(l)return l;
  if(!S.holdings.length)return emptyState();
  const f=S.hf;const c=compute(S.scope);
  return `<section class="panel"><div class="sec-head"><div><h2>Holdings</h2><div class="muted" style="font-size:12px;margin-top:2px">${c.hs.length} open positions · ${M(c.mkt)}</div></div><div class="actions"><button class="btn btn-ghost" data-act="go" data-v="import">Import</button><button class="btn btn-primary" data-act="add-holding">+ Add holding</button></div></div>
  <div class="toolbar"><input type="search" id="hf-q" placeholder="Search name, symbol or sector" value="${esc(f.q)}" style="max-width:280px" aria-label="Search holdings">
   <select id="hf-cls" style="max-width:170px" aria-label="Asset class"><option value="">All classes</option>${CLASSES.map(k=>`<option ${f.cls===k?'selected':''}>${k}</option>`).join('')}</select>
   <select id="hf-type" style="max-width:150px" aria-label="Type"><option value="">All types</option>${Object.entries(TYPE_LABEL).map(([k,v])=>`<option value="${k}" ${f.type===k?'selected':''}>${v}</option>`).join('')}</select>
   <label class="chip" style="cursor:pointer"><input type="checkbox" id="hf-miss" ${f.missing?'checked':''}> No buy price</label>
   <label class="chip" style="cursor:pointer"><input type="checkbox" id="hf-sold" ${f.sold?'checked':''}> Include sold-out</label></div>
  <div class="tbl-wrap"><table class="hl"><thead><tr>${th('name','Holding',1)}${th('qty','Qty')}${th('avg','Avg buy')}${th('price','Price')}${th('value','Value')}${th('day','Day')}${th('pnl','P&L')}${th('pct','P&L %')}</tr></thead><tbody id="hl-body">${holdingsBody()}</tbody></table></div>
  <div class="muted" style="font-size:12px;margin-top:10px">US stock values use today's USD to INR rate. P&L on them is calculated in dollars, then converted at that rate.</div></section>`;

function assetCard(x){

   <div class="muted" style="font-size:12px">${gain!=null?`Bought for ${M(+a.cost)} · <span class="${cls_(gain)}">${M(gain)}</span>`:''}${a.date?` ${gain!=null?'· ':''}Updated ${dfmt(a.date)}`:''}</div>${a.note?`<div class="soft" style="font-size:12px">${esc(a.note)}</div>`:''}</div>`;
}

/* ---------- transactions ---------- */
function vTransactions(){
  const l=loadingOrEmpty();if(l)return l;
  const f=S.tf,q=f.q.trim().toLowerCase();
  let rows=[];
  for(const h of S.holdings){if(!inScope(h.member,S.scope))continue;(h.txns||[]).forEach(t=>rows.push({h,t}))}
  if(f.type)rows=rows.filter(r=>r.t.t===f.type);
  if(q)rows=rows.filter(r=>(r.h.sym+' '+(r.h.name||'')).toLowerCase().includes(q));

  const shown=rows.slice(0,f.limit),multi=S.scope==='all'&&S.members.length>1;
  const lab={open:'Opening balance',buy:'Buy',sell:'Sell'};
  return `<section class="panel"><div class="sec-head"><div><h2>Transactions</h2><div class="muted" style="font-size:12px;margin-top:2px">${rows.length} entries. Buys update the average price automatically.</div></div><div class="actions"><button class="btn btn-ghost" data-act="go" data-v="import">Import statement</button><button class="btn btn-primary" data-act="add-txn">+ Add transaction</button></div></div>

  ${rows.length?`<div class="tbl-wrap"><table><thead><tr><th class="l">Date</th><th class="l">Holding</th><th class="l">Type</th><th>Qty</th><th>Price</th><th>Amount</th><th></th></tr></thead><tbody>${shown.map(r=>{const t=r.t,m=memberOf(r.h.member),amt=(+t.q||0)*(+t.p||0);return `<tr><td class="l">${t.d?dfmt(t.d):'<span class="muted">No date</span>'}</td><td class="l"><span class="nm">${multi?`<span class="dot" style="background:${esc(m.color)};margin-right:7px"></span>`:''}${esc(r.h.name||r.h.sym)}</span><span class="sy">${esc(r.h.sym)}</span></td><td class="l"><span class="chip ${t.t==='buy'?'gain':t.t==='sell'?'loss':''}">${lab[t.t]||t.t}</span></td><td>${qtyf(+t.q)}</td><td>${t.p!=null?MM(+t.p,r.h.ccy):'<span class="chip warn">unknown</span>'}</td><td>${t.p!=null?MM(amt,r.h.ccy):'—'}</td><td><button class="btn btn-ghost btn-sm" data-act="del-txn" data-h="${esc(r.h.id)}" data-t="${esc(t.id)}" aria-label="Delete transaction">Delete</button></td></tr>`}).join('')}</tbody></table></div>${rows.length>shown.length?`<div style="text-align:center;margin-top:12px"><button class="btn btn-ghost" data-act="more-tx">Show more (${rows.length-shown.length} left)</button></div>`:''}`:`<div class="muted" style="padding:20px 0">No transactions yet.</div>`}</section>`;
}

/* ============================== classification & normalising ============================== */
function normSym(s){
  s=String(s==null?'':s).trim().toUpperCase();
  s=s.replace(/^(NSE|BSE|NYSE|NASDAQ|NYSEARCA):/,'').replace(/\.(NS|BO)$/,'').replace(/-(EQ|BE|N1|BZ)$/,'');
  return s;
}
function inferClass(sym,name,sector,type,ccy){
  const s=(sym+' '+(name||'')).toLowerCase();
  if(type==='bond')return /gold|sgb/.test(s)?'Gold':'Debt';
  if(/gold/.test(s))return 'Gold';if(/silver/.test(s))return 'Silver';
  if(/liquid/.test(s))return 'Debt';
  if(type==='us'||ccy==='USD')return 'Equity (US)';
  if(/s&p 500|nasdaq|\bus\b|overseas/.test(s))return 'Equity (US)';
  const sec=(sector||'').toLowerCase();
  if(/^debt/.test(sec))return 'Debt';if(/^hybrid/.test(sec))return 'Hybrid';
  return 'Equity (India)';
}
function prettyFund(sym){
  let s=sym.replace(/^MUTF_IN:/,'').split('_');
  if(s.length>2&&/^[A-Z0-9]{6,}$/.test(s[s.length-1]))s.pop();
  return s.map(w=>w.charAt(0)+w.slice(1).toLowerCase()).join(' ');
}

function parseSheet(name,rows){

    for(const it of items){const k=it.sym+'|'+it.ccy;const x=by.get(k);if(!x){by.set(k,{...it});continue}

function parseWorkbook(wb){

  for(const s of use.filter(s=>s.kind==='asset'))for(const it of s.items){
    const ex=S.assets.find(a=>a.member===memId&&a.name===it.name);
    assets.push({id:ex?ex.id:uid(),member:memId,cat:it.cat,sub:it.sub,name:it.name,value:it.value,cost:it.cost,mode:'value',date:today(),note:ex?ex.note||'':''});stats.assets++}
  const items=Array.from(hmap.values()).filter(h=>changed.has(h.id));
  const total=items.length+assets.length,prog=$('#imp-prog');
  try{
    await Store.putMany('holdings',items,(d,n)=>{IMP.prog=`Saving ${d} of ${n}…`;const pe=$('#imp-prog');if(pe)pe.textContent=IMP.prog});
    if(assets.length)await Store.putMany('assets',assets);
  }catch(e){toast('Import stopped: '+(e.message||e),true);IMP.busy=false;return}
  IMP.sheets=[];IMP.file='';IMP.busy=false;IMP.prog='';
  const parts=[];
  if(stats.newH)parts.push(`${stats.newH} new holding${stats.newH>1?'s':''}`);
  if(stats.updH)parts.push(`${stats.updH} updated`);
  if(stats.tx)parts.push(`${stats.tx} transaction${stats.tx>1?'s':''} added`);
  if(stats.kept)parts.push(`${stats.kept} kept the average buy price you had, because the file had none`);
  if(stats.dupTx)parts.push(`${stats.dupTx} already imported, skipped`);
  if(stats.prices)parts.push(`${stats.prices} prices updated`);
  if(stats.noMatch)parts.push(`${stats.noMatch} price rows had no matching holding`);
  if(stats.assets)parts.push(`${stats.assets} asset${stats.assets>1?'s':''}`);
  openModal(`${mhead('Import finished')}<ul class="warnlist" style="font-size:14px;color:var(--mist-100)">${parts.map(p=>`<li>${p}</li>`).join('')||'<li>Nothing new to add.</li>'}</ul>${stats.over?`<div class="banner">${stats.over} holding${stats.over>1?'s have':' has'} more sells than buys in the file, usually because the statement starts after you bought. Add an opening balance for ${stats.over>1?'them':'it'} in the holding's detail.</div>`:''}
  <div class="modal-foot"><button class="btn btn-ghost" data-act="go" data-v="transactions">See transactions</button><button class="btn btn-primary" data-act="go" data-v="holdings">See holdings</button></div>`,{title:'Import finished'});
  render();
}

/* ============================== export ============================== */
const csvq=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=(head,rows)=>[head.map(csvq).join(',')].concat(rows.map(r=>r.map(csvq).join(','))).join('\n');
async function saveFile(name,data){
  let d=null;try{d=window.claude&&typeof window.claude.use==='function'?await window.claude.use('downloads'):null}catch(e){d=null}
  if(!d){if(blobSave(name,data,/\.json$/i.test(name)?'application/json':/\.csv$/i.test(name)?'text/csv':'text/plain'))toast('Saved '+name);else toast('Downloads are not available here.',true);return}
  try{await d.save({filename:name,data});toast('Saved '+name)}
  catch(e){if(e&&e.code==='declined')return;toast('Downloads are not available in this view.',true)}
}
function exportData(k){
  if(k==='holdings'){const rows=S.holdings.map(h=>{const e=enrich(h);return [memberOf(h.member).name,h.sym,h.name,h.type,h.cls,h.ccy,e.pos.qty,e.pos.avg,h.price,e.value,e.pnl]});
    return saveFile('holdings.csv',toCSV(['Member','Symbol','Name','Type','Class','Currency','Quantity','Avg buy price','Price','Value INR','Unrealised P&L INR'],rows))}
  if(k==='txns'){const rows=[];S.holdings.forEach(h=>(h.txns||[]).forEach(t=>rows.push([memberOf(h.member).name,h.sym,t.d||'',t.t,t.q,t.p==null?'':t.p,t.fee||0])));
    return saveFile('transactions.csv',toCSV(['Member','Symbol','Date','Type','Quantity','Price','Fees'],rows))}
  if(k==='assets'){const rows=S.assets.map(a=>[memberOf(a.member).name,a.cat,a.name,a.sub||'',assetValue(a).v,a.cost==null?'':a.cost,a.note||'']);
    return saveFile('other-assets.csv',toCSV(['Member','Category','Name','Detail','Value INR','Bought for','Note'],rows))}
  return saveFile('fintrack-backup.json',JSON.stringify({exported:today(),members:S.members,holdings:S.holdings,assets:S.assets,settings:S.settings,snaps:S.snaps},null,1));
}
function template(k){
  if(k==='txns')return saveFile('transactions-template.csv',toCSV(['Date','Symbol','Type','Quantity','Price','Fees'],[['2026-04-15','RELIANCE','BUY',2,1250.5,20],['2026-08-02','RELIANCE','SELL',1,1320,15]]));
  return saveFile('holdings-template.csv',toCSV(['Symbol','Name','Quantity','Average Price','Current Price'],[['HDFCBANK','HDFC Bank Ltd',10,820.4,708.2],['INFY','Infosys Ltd',3,1450,1025.1]]));
}

/* ============================== events ============================== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  switch(a){
    case 'go':S.view=t.dataset.v;saveLS('ft_view',S.view);closeModal();render();window.scrollTo({top:0});break;
    case 'scope':S.scope=t.dataset.id;saveLS('ft_scope',S.scope);if(t.dataset.go)S.view=t.dataset.go;render();break;
    case 'close':closeModal();break;
    case 'sort':{const k=t.dataset.k;if(S.hf.sort===k)S.hf.dir*=-1;else{S.hf.sort=k;S.hf.dir=k==='name'?1:-1}render();break}
    case 'show-missing':S.hf.missing=true;S.view='holdings';render();break;
    case 'open-holding':holdingModal(t.dataset.id);break;
    case 'add-holding':addHoldingModal();break;
    case 'add-asset':assetModal(null,t.dataset.cat);break;
    case 'edit-asset':assetModal(t.dataset.id);break;
    case 'add-member':memberModal();break;
    case 'edit-member':memberModal(t.dataset.id);break;
    case 'add-txn':addTxnModal();break;
    case 'more-tx':S.tf.limit+=200;render();break;
    case 'ah-mode':{S._ahMode=t.dataset.m;$$('[data-act=ah-mode]').forEach(b=>b.setAttribute('aria-pressed',b===t));$('#ah-own').hidden=S._ahMode!=='own';$('#ah-buy').hidden=S._ahMode!=='buy';break}
    case 'ah-save':ahSave();break;
    case 'at-go':{const id=val('at-h');holdingModal(id);break}
    case 'hd-side':{S._side=t.dataset.s;$$('[data-act=hd-side]').forEach(b=>b.setAttribute('aria-pressed',b===t));hdPreview();break}
    case 'hd-price':{const h=S.holdings.find(x=>x.id===t.dataset.id);const p=numv('hd-price');if(h&&p!=null){Store.put('holdings',{...h,price:p,priceAt:today()});toast('Price updated');holdingModal(h.id)}break}
    case 'hd-add':{const h=S.holdings.find(x=>x.id===t.dataset.id);const q=numv('hd-q'),p=numv('hd-p');if(!h)break;if(!(q>0)||p==null){toast('Enter quantity and price',true);break}
      const tx={id:uid(),d:val('hd-date')||today(),t:S._side,q,p,fee:numv('hd-fee')||0};
      const nh={...h,txns:[...(h.txns||[]),tx]};if(calcPos(nh).warn.length&&S._side==='sell'){toast('That sells more than you hold',true);break}
      Store.put('holdings',nh);toast(S._side==='buy'?'Buy added, average price updated':'Sale recorded');holdingModal(h.id);break}
    case 'hd-set':{const h=S.holdings.find(x=>x.id===t.dataset.id);const q=numv('hd-sq'),p=numv('hd-sa');if(!h)break;if(!(q>=0)){toast('Enter the quantity',true);break}
      Store.put('holdings',{...h,txns:[{id:uid(),d:null,t:'open',q,p}]});toast('Position set');holdingModal(h.id);break}
    case 'hd-deltx':{const h=S.holdings.find(x=>x.id===t.dataset.id);if(!h)break;Store.put('holdings',{...h,txns:h.txns.filter(x=>x.id!==t.dataset.t)});toast('Transaction removed');holdingModal(h.id);break}
    case 'del-txn':{const h=S.holdings.find(x=>x.id===t.dataset.h);if(!h)break;Store.put('holdings',{...h,txns:h.txns.filter(x=>x.id!==t.dataset.t)});toast('Transaction removed');break}
    case 'hd-del-ask':$('#hd-foot').innerHTML=`<span class="muted" style="align-self:center">Delete this holding and its history?</span><button class="btn btn-danger" data-act="hd-del" data-id="${esc(t.dataset.id)}">Yes, delete</button><button class="btn btn-ghost" data-act="close">Keep</button>`;break;
    case 'hd-del':Store.del('holdings',t.dataset.id);closeModal();toast('Holding deleted');break;
    case 'as-mode':{S._asMode=t.dataset.m;$$('[data-act=as-mode]').forEach(b=>b.setAttribute('aria-pressed',b===t));asRefresh(S._asEdit);break}
    case 'as-save':asSave(t.dataset.id||null);break;
    case 'as-del-ask':$('#as-delbox').innerHTML=`<button class="btn btn-danger" data-act="as-del" data-id="${esc(t.dataset.id)}">Confirm delete</button>`;break;
    case 'as-del':Store.del('assets',t.dataset.id);closeModal();toast('Deleted');break;
    case 'mb-col':{$('#mb-col').value=t.dataset.c;$$('[data-act=mb-col]').forEach(b=>b.style.borderColor=b===t?'#fff':'transparent');break}
    case 'mb-save':{const nm=val('mb-name');if(!nm){toast('Enter a name',true);break}const ex=S.members.find(x=>x.id===t.dataset.id);Store.put('members',{...(ex||{}),id:ex?ex.id:uid(),name:nm,relation:val('mb-rel'),color:val('mb-col'),order:ex?ex.order:S.members.length});closeModal();toast('Saved');break}
    case 'mb-del-ask':$('#mb-delbox').innerHTML=`<button class="btn btn-danger" data-act="mb-del" data-id="${esc(t.dataset.id)}">Delete with all their data</button>`;break;
    case 'mb-del':{const id=t.dataset.id;S.holdings.filter(h=>h.member===id).forEach(h=>Store.del('holdings',h.id));S.assets.filter(x=>x.member===id).forEach(x=>Store.del('assets',x.id));Store.del('members',id);if(S.scope===id)S.scope='all';closeModal();toast('Member deleted');break}
    case 'imp-toggle':{IMP.sheets[+t.dataset.i].use=t.checked;$('#imp-body').innerHTML=impBody();break}
    case 'imp-clear':IMP.sheets=[];IMP.file='';render();break;
    case 'imp-go':runImport();break;
    case 'template':template(t.dataset.k);break;
    case 'export':exportData(t.dataset.k);break;
    case 'lock-now':location.reload();break;
    case 'make-login':try{localStorage.removeItem('ft_skip')}catch(e){}location.reload();break;
    case 'change-login':openModal(`${mhead('Change username or password','Choose the new details. Your recovery code stays the same.')}
      <div class="form-grid"><label class="fld"><span>New username</span><input type="text" id="cp-user" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label class="fld"><span>New password</span><input type="password" id="cp-pw" autocomplete="new-password"></label>
      <label class="fld"><span>Confirm password</span><input type="password" id="cp-pw2" autocomplete="new-password"><small>At least 8 characters.</small></label></div>
      <div class="err" id="cp-err" role="alert" style="color:#ff8497;font-size:13px;min-height:18px;margin-top:6px"></div>
      <div class="actions" style="margin-top:10px"><button class="btn btn-primary" data-act="cp-go">Save</button></div>`);break;
    case 'cp-go':{const u=val('cp-user'),p=$('#cp-pw').value,e=m=>{$('#cp-err').textContent=m};
      if(!u){e('Enter a username.');break}if(p.length<8){e('Use at least 8 characters for the password.');break}if(p!==$('#cp-pw2').value){e('The two passwords do not match.');break}
      Auth.changeLogin(u,p).then(()=>{closeModal();toast('Login updated')}).catch(()=>e('Could not update. Please try again.'));break}
    case 'new-recovery':Auth.newRecovery().then(code=>{openModal(`${mhead('Your new recovery code','The old code no longer works. Keep this one safe.')}
      <div class="panel" style="padding:14px;text-align:center;margin-bottom:10px"><div id="rc-code" style="font-family:var(--font-mono);font-size:17px;letter-spacing:.06em;word-break:break-all;user-select:all">${code}</div></div>
      <div class="actions"><button class="btn btn-ghost" data-act="rc-copy" data-code="${code}">Copy</button><button class="btn btn-ghost" data-act="rc-dl" data-code="${code}">Download</button></div>`)}).catch(()=>toast('Could not make a new code',true));break;
    case 'rc-copy':navigator.clipboard&&navigator.clipboard.writeText(t.dataset.code).then(()=>toast('Copied')).catch(()=>toast('Select the code and copy it',true));break;
    case 'rc-dl':blobSave('family-fintrack-recovery-code.txt',Auth.codeFile(t.dataset.code),'text/plain');break;
    case 'mkt-detail':mktModal();break;
    case 'pnl-detail':pnlModal();break;
    case 'refresh':Live.refresh(true);break;
    case 'save-live':{const px=val('s-proxy').trim();if(px&&!/^https:\/\/.+\{url\}/.test(px)){toast('The relay address must start with https:// and contain {url}',true);break}
      Store.put('settings',{autoPrices:$('#s-auto').checked,metalAuto:$('#s-metalauto').checked,premium:numv('s-premium')||0,proxyUrl:px});toast('Live price settings saved');Live.route=null;break}
    case 'hd-src':{const h=S.holdings.find(x=>x.id===t.dataset.id);if(!h)break;const v=val('hd-src').trim();
      Store.put('holdings',h.type==='mf'?{...h,code:v||undefined}:{...h,ysym:v||undefined});toast('Saved. Fetching the price');Live.refresh(true,[h.id]);break}
    case 'save-family':{let n=val('s-family').replace(/\s+/g,' ').trim().replace(/\s+family$/i,'');Store.put('settings',{familyName:n});toast(n?'Family name saved':'Family name cleared');break}
    case 'save-rates':{const fx=numv('s-fx'),g=numv('s-gold'),s=numv('s-silver');Store.put('settings',{fx:fx>0?fx:S.settings.fx,gold:g,silver:s});toast('Rates saved');break}
    case 'reset-ask':$('#reset-box').innerHTML=`<button class="btn btn-danger" data-act="reset-go">Yes, delete everything</button> <button class="btn btn-ghost" data-act="go" data-v="settings">Cancel</button>`;break;
    case 'reset-go':{S.holdings.slice().forEach(h=>Store.del('holdings',h.id));S.assets.slice().forEach(x=>Store.del('assets',x.id));S.snaps.slice().forEach(x=>Store.del('snaps',x.id));toast('All data deleted');break}
  }
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='hf-q'){S.hf.q=e.target.value;const b=$('#hl-body');if(b)b.innerHTML=holdingsBody()}
  else if(id==='tf-q'){S.tf.q=e.target.value;S.tf.limit=150;clearTimeout(S._tq);S._tq=setTimeout(render,200)}
  else if(/^hd-(q|p|fee|date)$/.test(id))hdPreview();
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='hf-cls'){S.hf.cls=e.target.value;render()}
  else if(id==='hf-type'){S.hf.type=e.target.value;render()}
  else if(id==='hf-miss'){S.hf.missing=e.target.checked;render()}
  else if(id==='hf-sold'){S.hf.sold=e.target.checked;render()}
  else if(id==='tf-type'){S.tf.type=e.target.value;render()}
  else if(id==='ah-type'){$('#ah-ccy').textContent=e.target.value==='us'?'$':'₹'}
  else if(id==='ah-mem'||id==='ah-sym')ahCheckExisting();
  else if(id==='as-cat'){asRefresh(S._asEdit)}
  else if(id==='im-mem'){IMP.member=e.target.value;$('#im-new').hidden=e.target.value!=='__new'}
  else if(id==='im-mode')IMP.mode=e.target.value;
  else if(id==='im-src')IMP.src=e.target.value;
});
document.addEventListener('input',e=>{if(e.target.id==='ah-sym')ahCheckExisting()});
$('#btn-lock').addEventListener('click',()=>location.reload());
$('#btn-mask').addEventListener('click',e=>{const on=document.body.classList.toggle('mask');e.currentTarget.setAttribute('aria-pressed',on);saveLS('ft_mask',on?'1':'0')});

/* ============================== boot ============================== */
(function boot(){
  const h=(location.hash||'').replace('#','');
  const v=loadLS('ft_view');if(NAVS.some(n=>n[0]===h))S.view=h;else if(v&&NAVS.some(n=>n[0]===v))S.view=v;
  const sc=loadLS('ft_scope');if(sc)S.scope=sc;
  if(loadLS('ft_mask')==='1'){document.body.classList.add('mask');$('#btn-mask').setAttribute('aria-pressed','true')}
  render();
  Store.init().then(()=>Live.start());
})();
</script>
